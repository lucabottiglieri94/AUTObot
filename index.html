<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI BOTT Automotive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  :root{
    --bg0:#121214;
    --bg1:rgba(28,28,30,0.80);
    --bg2:rgba(44,44,46,0.82);
    --bg3:rgba(58,58,60,0.86);

    --panel:rgba(44,44,46,0.72);
    --line:rgba(255,255,255,0.12);

    --text:#ffffff;
    --muted:rgba(235,235,245,0.6);

    --accent:#007aff;
    --accent2:#5ac8ff;

    --orange:#ff9500;
    --orange2:#ffb84d;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(circle at top left, #2a2a2e 0, #121214 45%) fixed,
      radial-gradient(circle at bottom right, #1c1c1e 0, #000000 55%) fixed;
    background-color:#121214;
    padding-top:56px;
    -webkit-font-smoothing:antialiased;
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:99999;
    pointer-events:auto;
    background:rgba(18,18,18,0.78);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-bottom:1px solid rgba(255,255,255,0.14);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  header.header-hidden{transform:translateY(-110%)}

  .wrap{max-width:1200px;margin:0 auto;padding:8px 16px}

  .brand{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:unset}
  .brandLogo{width:36px;height:36px;object-fit:contain;background:transparent;border:none;outline:none;filter:none;mix-blend-mode:screen}
  .brandName{
    font-weight:950;letter-spacing:.2px;font-size:16px;line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    white-space:nowrap
  }
  .brandSub{opacity:.75;white-space:nowrap;font-size:12px}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brandMark{display:flex;align-items:center;gap:8px;user-select:none}

  .btn{
    position:relative;
    z-index:2;
    pointer-events:auto;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.75);
    color:var(--text);
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    font-size:13px;
    transition:all .18s;
    font-weight:600;
    font-family:inherit;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .btn:hover{
    border-color:rgba(0,122,255,0.55);
    background:rgba(58,58,60,0.9);
    transform:translateY(-1px);
  }
  .btn.primary{
    border-color:rgba(0,122,255,0.65);
    background:linear-gradient(135deg,rgba(0,122,255,0.20),rgba(90,200,255,0.18));
  }
  .btn.primary:hover{
    background:linear-gradient(135deg,rgba(0,122,255,0.32),rgba(90,200,255,0.28));
  }
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  .btn.brand-fiat:hover{border-color:rgba(220,38,38,.6);background:rgba(220,38,38,.14)}
  .btn.brand-jeep:hover{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.14)}
  .btn.brand-alfa:hover{border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.14)}
  .btn.brand-lancia:hover{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.14)}

  .centroAutoLink{
    display:inline-flex;align-items:center;padding:4px 10px;
    border:1px solid rgba(34,197,94,.45);
    background:rgba(34,197,94,.10);
    border-radius:999px;
    transition:all .3s;
    text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .centroAutoLink:hover{
    border-color:rgba(34,197,94,.8);
    background:rgba(34,197,94,.20);
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(0,0,0,.7);
  }
  .centroAutoLogo{
    height:32px;width:auto;object-fit:contain;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));
  }

  .pill{
    padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.8);
    font-size:12px;white-space:nowrap;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .muted{color:var(--muted)}
  .accountBox{display:flex;align-items:center;gap:9px;min-width:0;padding:5px 9px 5px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(44,44,46,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .authDiagnostic{position:absolute;right:18px;top:74px;max-width:520px;font-size:11px;color:#fca5a5;display:none;z-index:30}.authDiagnostic.show{display:block}
  .accountAvatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 30px;background:rgba(255,255,255,.10);font-size:15px;border:1px solid rgba(255,255,255,.12)}
  .accountAvatar img{width:100%;height:100%;object-fit:cover}
  .accountInfo{min-width:0;line-height:1.12}
  .accountState{font-size:12px;font-weight:800;white-space:nowrap}
  .accountEmail{font-size:10px;color:var(--muted);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .accountBox.logged{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.07)}

  .layout{
    margin-top:16px;
    display:grid;
    grid-template-columns:420px minmax(0,1fr);
    gap:16px;
    align-items:start;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--tintBorder, var(--line));
    border-radius:18px;
    box-shadow:0 18px 45px rgba(0,0,0,.75);
    max-height:none;
    overflow:hidden;
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
  }

  .panelHeader{
    padding:14px 14px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--tintTop,rgba(255,255,255,.06)), rgba(10,12,18,.95) 70%);
border-bottom:1px solid var(--tintBorder, var(--line));
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .panelTitle{font-weight:950;font-size:18px}
  .panelSub{margin-top:6px}
.weekTop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .weekDow{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .weekDay{font-size:16px;font-weight:950}
  .weekTasks{margin-top:2px;display:grid;gap:4px;overflow:hidden}
  .weekTask{
    font-size:10px;line-height:1.2;color:var(--text);opacity:.9;
    padding:4px 6px;border-radius:7px;
    border:1px solid var(--line);
    background:rgba(58,58,60,0.9);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .weekTask.done{opacity:.55;text-decoration:line-through}
  .weekMore{font-size:11px;color:#fb923c;opacity:.85;font-weight:700}

  .cmpSuggest{
    background:rgba(0,122,255,0.16);
    border:1px solid rgba(0,122,255,0.40);
    border-radius:999px;
    padding:4px 10px;
    color:#c7e1ff;
    font-size:11px;
    cursor:pointer;
    transition:all .2s;
    font-family:inherit;
  }
  .cmpSuggest:hover{
    background:rgba(0,122,255,0.26);
    border-color:rgba(0,122,255,0.70);
  }

  .widgetStack{display:grid;gap:16px;margin-top:16px}
  .widgetPanel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow:0 18px 40px rgba(0,0,0,.7);
  }
  .widgetHeader{
    padding:13px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--tintTop,rgba(255,255,255,.06)), rgba(10,12,18,.95) 70%);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .widgetTitle{font-weight:950;font-size:18px}
  .widgetSub{color:#d1d1d6;font-size:13px;margin-top:4px}
  .widgetBody{padding:14px 18px}

  .formRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{
    flex:1;min-width:220px;
    background:rgba(44,44,46,0.9);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    color:var(--text);
    font-size:13px;
    outline:none;
    font-family:inherit;
    transition:border-color .2s,background .2s,box-shadow .2s;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .field:focus{
    border-color:var(--orange);
    background:rgba(58,58,60,0.98);
    box-shadow:0 0 0 1px rgba(255,149,0,0.4);
  }

  .seg{
    display:inline-flex;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.9);
    border-radius:999px;
    overflow:hidden;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .seg button{
    border:none;background:transparent;color:var(--muted);
    padding:8px 10px;font-size:12px;cursor:pointer;
    transition:all .2s;
    font-family:inherit;font-weight:700;
    white-space:nowrap;
  }
  .seg button.active{
    color:#fff;
    background:linear-gradient(135deg,rgba(255,149,0,0.32),rgba(255,184,77,0.24));
  }
  .seg button:hover{
    background:rgba(255,149,0,0.16);color:#fff7e6;
  }

  .split3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;align-items:start}
  .dayCol{
    background:rgba(44,44,46,0.9);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .dayHead{
    padding:10px 14px;
    font-weight:800;font-size:13px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(0,0,0,.18);
  }
  .dayMeta{color:var(--muted);font-weight:700;font-size:12px}
  .list{padding:10px 12px;display:grid;gap:8px;max-height:260px;overflow:auto}

  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:11px;
    background:rgba(28,28,30,0.92);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .itemMain{flex:1;min-width:0}
  .itemText{font-size:13px;line-height:1.35;word-break:break-word}
  .itemText.done{text-decoration:line-through;opacity:.65}
  .itemActions{display:flex;gap:6px;align-items:center}

  .iconBtn{
    width:30px;height:30px;
    border-radius:9px;
    border:1px solid var(--line);
    background:rgba(58,58,60,0.95);
    color:var(--text);
    cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .iconBtn:hover{
    border-color:rgba(255,149,0,0.55);
    background:rgba(44,44,46,0.98);
    transform:translateY(-1px);
  }

  .chk{width:18px;height:18px;flex:0 0 auto;accent-color:var(--orange);margin-top:2px;cursor:pointer}
  .memoArea{width:100%;min-height:100px;resize:vertical}
  .smallNote{margin-top:10px;color:var(--muted);font-size:12px}

  .syncBadge{
    font-size:12px;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.9);
    color:var(--muted);
    white-space:nowrap;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .syncBadge.ok{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08);color:#bbf7d0}
  .syncBadge.warn{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.10);color:#fde68a}

  #agendaPanel .widgetHeader,#memoPanel .widgetHeader{
    background:linear-gradient(180deg,var(--tintTop,rgba(255,255,255,.06)), rgba(10,12,18,.95) 70%);
  }

  /* VENDITE + BARRA PROVV */
  .venditePanel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    margin-top:16px;
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow:0 18px 45px rgba(0,0,0,.75);
  }
  .venditeHeader{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,rgba(10,10,12,0.85),rgba(44,44,46,0.96));
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .venditeTitleRow{display:flex;align-items:center;gap:10px}
  .venditeTitle{font-weight:950;font-size:18px}
  .venditeSyncBadge{
    font-size:11px;padding:4px 10px;border-radius:999px;
    border:1px solid rgba(31,41,55,.9);
    background:rgba(17,24,39,.45);
    color:var(--muted);white-space:nowrap;
  }
  .venditeSyncBadge.ok{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.10);color:#bbf7d0}

  .venditeNav{display:flex;align-items:center;gap:8px}
  .navArrow{
    width:32px;height:32px;border-radius:9px;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.9);
    color:var(--text);
    cursor:pointer;font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .navArrow:hover{
    border-color:rgba(0,122,255,0.55);
    background:rgba(58,58,60,0.98);
    transform:translateY(-1px);
  }
  .navArrow:disabled{opacity:.35;cursor:not-allowed;transform:none}

  .venditeMonthLabel{font-weight:900;font-size:15px;min-width:140px;text-align:center;padding:0 4px}
  .venditeTotali{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .totCard{
    padding:14px 18px;
    display:flex;flex-direction:column;gap:4px;
    background:rgba(28,28,30,0.92);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .totCard:not(:last-child){border-right:1px solid var(--line)}
  .totLabel{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .totNum{font-size:36px;font-weight:950;line-height:1}
  .totNum.nuova{color:#60a5fa}.totNum.usata{color:#f97316}.totNum.all{color:#22c55e}

  .venditeForm{
    padding:12px 18px;
    border-bottom:1px solid rgba(31,41,55,.5);
    display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
    background:rgba(17,17,20,0.95);
  }
  .venditeForm .fld{
    flex:1;min-width:150px;
    background:rgba(44,44,46,0.92);
    border:1px solid var(--line);
    border-radius:12px;
    padding:9px 13px;
    color:var(--text);
    font-size:13px;
    outline:none;
    font-family:inherit;
    transition:border-color .2s,background .2s,box-shadow .2s;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .venditeForm .fld:focus{
    border-color:var(--accent);
    background:rgba(58,58,60,0.98);
    box-shadow:0 0 0 1px rgba(0,122,255,0.4);
  }
  .venditeForm .fld::placeholder{color:var(--muted)}

  .tipoSeg{
    display:inline-flex;
    border:1px solid var(--line);
    background:rgba(44,44,46,0.9);
    border-radius:999px;
    overflow:hidden;
    flex-shrink:0;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .tipoBtn{
    border:none;background:transparent;color:var(--muted);
    padding:9px 14px;font-size:13px;cursor:pointer;
    font-family:inherit;font-weight:700;
    transition:all .2s;white-space:nowrap;
  }
  .tipoBtn.nuova.active{
    background:linear-gradient(135deg,rgba(59,130,246,.32),rgba(96,165,250,.24));color:#c7e1ff;
  }
  .tipoBtn.usata.active{
    background:linear-gradient(135deg,rgba(249,115,22,.32),rgba(251,146,60,.24));color:#ffddb5;
  }
  .tipoBtn:hover{opacity:.9}

  .venditeListe{display:grid;grid-template-columns:1fr 1fr;min-height:160px}
  .venditeCol{padding:12px 14px}
  .venditeCol:first-child{border-right:1px solid var(--line)}
  .venditeColTitle{font-size:12px;font-weight:900;letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .venditeColTitle.nuova{color:#60a5fa}.venditeColTitle.usata{color:#f97316}

  .venditeCount{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .venditeCount.nuova{background:rgba(59,130,246,.22);border:1px solid rgba(59,130,246,.45);color:#c7e1ff}
  .venditeCount.usata{background:rgba(249,115,22,.18);border:1px solid rgba(249,115,22,.45);color:#ffddb5}

  .venditeList{display:grid;gap:6px;max-height:320px;overflow-y:auto}
  .venditeList::-webkit-scrollbar{width:4px}
  .venditeList::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:999px}

  .autoItem{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(28,28,30,0.95);
    animation:itemIn .2s ease;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  @keyframes itemIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .autoN{font-size:11px;font-weight:900;min-width:20px;color:var(--muted)}
  .autoModello{flex:1;font-size:13px;line-height:1.3;word-break:break-word}
  .autoProvv{
    font-size:12px;font-weight:700;
    color:#4ade80;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.25);
    border-radius:6px;
    padding:2px 7px;
    white-space:nowrap;flex-shrink:0;
  }
  .autoProvv.zero{
    color:var(--muted);
    background:transparent;
    border-color:rgba(60,60,67,0.6);
    font-weight:400;
  }
  .autoDelBtn{
    width:24px;height:24px;
    border-radius:7px;
    border:1px solid rgba(60,60,67,0.7);
    background:rgba(18,18,18,0.9);
    color:var(--muted);
    cursor:pointer;font-size:14px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;flex-shrink:0;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .autoDelBtn:hover{
    border-color:rgba(239,68,68,.6);
    background:rgba(239,68,68,.16);
    color:#fecaca;
  }
  .emptyList{font-size:12px;color:var(--muted);font-style:italic;padding:8px 2px}

  .venditeProvvBar{
    border-top:1px solid var(--line);
    padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:rgba(22,22,24,0.9);
  }
  .provvMeseGroup{display:flex;flex-direction:column;gap:2px}
  .provvMeseLabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .provvMeseNum{font-size:24px;font-weight:950;color:#4ade80;font-variant-numeric:tabular-nums}
  .provvMeseSplit{font-size:11px;color:var(--muted);margin-top:2px}

  .vendite2026Bar{
    border-top:1px solid rgba(251,191,36,.3);
    padding:14px 18px;
    background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(22,22,24,0.96));
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .bar2026Left{display:flex;align-items:center;gap:10px}
  .bar2026Icon{font-size:22px}
  .bar2026Title{font-weight:900;font-size:14px}
  .bar2026Sub{font-size:11px;color:var(--muted);margin-top:2px}
  .bar2026Right{text-align:right}

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, setPersistence, browserLocalPersistence, browserSessionPersistence,

    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

      Fiat:"https://www.fiat.it/omni/configuratore/#/",

      AlfaRomeo:"https://www.alfaromeo.it/omni/configuratore",
      Lancia:"https://www.lancia.it/omni/configuratore"
    };
    const firebaseConfig = {
      apiKey:"AIzaSyALsFF_dpL39GlPfMyKBFIKtZi5coOk9I8",
      authDomain:"auto-1af60.firebaseapp.com",
      projectId:"auto-1af60",
      storageBucket:"auto-1af60.firebasestorage.app",
      messagingSenderId:"498320258984",
      appId:"1:498320258984:web:bac67d7634273d10464f9d",
      measurementId:"G-WYM78KQWQJ"
    };
    const $ = id => document.getElementById(id);
    const setStatus = t => { console.log("[AI BOTT]", t); };
    function escapeHtml(s=""){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

    const app=initializeApp(firebaseConfig);
    const auth=getAuth(app);
    const db=getFirestore(app);
    enableIndexedDbPersistence(db).catch(()=>{});
    const provider=new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});

    // Persistenza login: dopo il primo accesso Google, l'utente resta loggato.
    (async function(){
      try{ await setPersistence(auth,browserLocalPersistence); }
      catch{ try{ await setPersistence(auth,browserSessionPersistence); }catch{} }
      try{ await getRedirectResult(auth); }catch(e){
        console.warn("[AI BOTT] Redirect Google:",e);
        const diag=$("authDiagnostic");
        if(diag){ diag.textContent="Google/Firebase: "+(e?.code||e?.message||"errore login"); diag.classList.add("show"); }
      }
    })();

    // LOGIN GOOGLE — stessa logica stabile della versione precedente.
    $("loginBtn").addEventListener("click",async()=>{
      try{
        const btn=$("loginBtn");
        btn.disabled=true;
        setStatus("🔐 Apertura login...");
        try{
          const r=await signInWithPopup(auth,provider);
          setStatus("✅ Login riuscito! "+(r.user?.email||""));
        }catch(pe){
          if(["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(pe?.code)){
            setStatus("🔄 Reindirizzamento...");
            await signInWithRedirect(auth,provider);
            return;
          }
          throw pe;
        }
      }catch(e){
        console.error("[AI BOTT] Login Google:",e);
        let msg=e?.code||e?.message||"Errore login";
        if(e?.code==="auth/unauthorized-domain") msg="Dominio non autorizzato in Firebase";
        else if(e?.code==="auth/operation-not-allowed") msg="Accesso Google non abilitato in Firebase";
        else if(e?.code==="auth/network-request-failed") msg="Errore di rete";
        else if(e?.code==="auth/invalid-api-key") msg="API Key Firebase non valida";
        setStatus("❌ "+msg);
        const diag=$("authDiagnostic");
        if(diag){diag.textContent="Google/Firebase: "+msg;diag.classList.add("show");}
      }finally{
        if(!auth.currentUser) $("loginBtn").disabled=false;
      }
    });

    $("logoutBtn").addEventListener("click",async()=>{
      try{await signOut(auth);setStatus("👋 Logout.");}
      catch(e){setStatus("❌ "+(e?.message||e));}
    });

    async function loadNews(){
      const list = $("newsList");
      const status = $("newsStatus");
      const btn = $("refreshNewsBtn");
      if(!list || !status || !btn) return;

      if(!auth.currentUser){
        list.innerHTML="";
        status.textContent="Effettua il login per caricare le news.";
        btn.disabled=true;
        return;
      }

      btn.disabled=true;
      status.textContent="⏳ Caricamento news...";
      list.innerHTML='<div style="padding:18px;text-align:center;color:#94a3b8;font-size:12px;">Caricamento...</div>';

      try{
        const r = await fetch(NEWS_PROXY,{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);

        const data = await r.json();
        if(data.status !== "ok" || !Array.isArray(data.items)){
          throw new Error(data.message || "RSS non disponibile");
        }

        const items = data.items.slice(0,8);

        if(!items.length){
          list.innerHTML='<div style="padding:18px;text-align:center;color:#94a3b8;font-size:12px;">Nessuna news disponibile.</div>';
        }else{
          list.innerHTML = items.map(item=>{
            const link = item.link || item.guid || "#";
            const title = item.title || "Senza titolo";
            const date = newsDate(item.pubDate);
            return `
              <a class="newsItem" href="${newsEscape(link)}" target="_blank" rel="noopener noreferrer">
                <div class="newsTitle">${newsEscape(title)}</div>
                <div class="newsMeta">🔗 Motor1.com Italia</div>
                ${date ? `<div class="newsDate">🕒 ${newsEscape(date)}</div>` : ""}
              </a>`;
          }).join("");
        }

        status.textContent=`✅ ${items.length} news caricate`;
      }catch(err){
        list.innerHTML=`
          <div style="padding:18px;text-align:center;color:#fca5a5;font-size:12px;">
            ❌ Impossibile caricare le news.<br>
            <span style="color:#94a3b8;">Riprova tra qualche secondo.</span>
          </div>`;
        status.textContent="❌ Errore caricamento RSS";
        console.warn("RSS News:",err);
      }finally{
        btn.disabled=!auth.currentUser;
      }
    }

    $("refreshNewsBtn")?.addEventListener("click",loadNews);

    /* ══ AUTH STATE ══ */
    onAuthStateChanged(auth,user=>{
      const accountBox=$("accountBox"), accountAvatar=$("accountAvatar"), accountState=$("accountState"), accountEmail=$("accountEmail");
      const userPill=$("userPill"), loginBtn=$("loginBtn"), logoutBtn=$("logoutBtn");
      if(user){
        const displayName=user.displayName||"Account Google", email=user.email||"Account Google";
        const diag=$("authDiagnostic"); if(diag) diag.classList.remove("show");
        userPill.textContent="☁️ Sync in corso…"; userPill.classList.remove("muted"); userPill.style.borderColor="rgba(34,197,94,.35)"; userPill.style.background="rgba(34,197,94,.08)";
        accountBox.classList.add("logged"); accountState.textContent="✅ Loggato con Google"; accountEmail.textContent=email; accountEmail.title=email;
        accountAvatar.innerHTML=user.photoURL?`<img src="${escapeHtml(user.photoURL)}" alt="">`:(displayName.trim()[0]||"👤").toUpperCase();
        loginBtn.style.display="none"; logoutBtn.style.display="inline-block";
        if($("refreshNewsBtn"))$("refreshNewsBtn").disabled=false;
        try{loadNews()}catch(e){console.warn("News:",e)} try{refreshDayHeaders()}catch(e){console.warn("Planner headers:",e)}
        try{startPlannerSync(user)}catch(e){console.warn("Planner:",e)} try{startVenditeSync(user)}catch(e){console.warn("Vendite:",e)}
        try{startTelSync(user)}catch(e){console.warn("Telefono:",e)} try{startConsegneSync(user)}catch(e){console.warn("Consegne:",e)}
        try{startPostSync(user)}catch(e){console.warn("Post vendita:",e)} try{renderOggi()}catch(e){console.warn("Oggi:",e)}
        try{if(window._startObSync)window._startObSync(user)}catch(e){console.warn("Obiettivo:",e)} try{renderWeekCalendar()}catch(e){console.warn("Calendario:",e)} try{updateVendPdfButtons()}catch(e){console.warn("PDF:",e)}
      }else{
        const diag=$("authDiagnostic"); if(diag) diag.classList.remove("show");
        userPill.textContent="🔒 Sync non attivo"; userPill.classList.add("muted"); userPill.style.borderColor=""; userPill.style.background="";
        accountBox.classList.remove("logged"); accountState.textContent="🔒 Non loggato"; accountEmail.textContent="Accedi con Google per sincronizzare i tuoi dati"; accountEmail.title=""; accountAvatar.innerHTML="👤";
        loginBtn.style.display="inline-block"; loginBtn.disabled=false; logoutBtn.style.display="none";
        if($("refreshNewsBtn"))$("refreshNewsBtn").disabled=true; if($("newsList"))$("newsList").innerHTML=""; if($("newsStatus"))$("newsStatus").textContent="Effettua il login per caricare le news.";
        try{stopPlannerSync()}catch{} try{stopVenditeSync()}catch{} try{stopTelSync()}catch{} try{stopConsegneSync()}catch{} try{stopPostSync()}catch{} try{renderOggi()}catch{} try{if(window._stopObSync)window._stopObSync()}catch{} try{updateVendPdfButtons()}catch{}
      }
    });

    /* ══ CHATBOT ══ */
    let chatHistory=[],isMinimized=false;
    const chatTrigger=$("chatTrigger"),chatBox=$("chatBox"),chatMessages=$("chatMessages"),chatInputField=$("chatInputField"),chatSendBtn=$("chatSendBtn");
    chatTrigger.addEventListener("click",()=>{chatBox.classList.add("open");chatBox.classList.remove("minimized");chatTrigger.style.display="none";$("chatMinimizedLogo").style.display="none";chatInputField.focus()});

    function detectBrand(text){
      const low=text.toLowerCase();
      for(const key of Object.keys(BRAND_SITES).sort((a,b)=>b.length-a.length)){
        if(low.includes(key))return{key,...BRAND_SITES[key]};
      }
      for(const model of Object.keys(MODEL_TO_BRAND).sort((a,b)=>b.length-a.length)){
        if(low.includes(model)){const bk=MODEL_TO_BRAND[model];return{key:bk,...BRAND_SITES[bk]}}
      }
      return null;
    }

    function needsSearch(text){
      if(detectBrand(text))return true;
      const kw=['prezzo','costo','listino','allestimento','versione','dotazione','optional','motore','cavalli','cv','kw','consumi','autonomia','dimensioni','bagagliaio','colori','confronto','differenza','meglio','vs','ibrida','elettrica','plug-in','diesel','benzina','gpl','trazione','integrale','cambio','automatico','garanzia','manutenzione','usato','usata','usati','usate','seconda mano','km zero','centroauto','occasione'];
      const low=text.toLowerCase();return kw.some(k=>low.includes(k));
    }

    async function runSearch(eQ,allowedDomains){
      try{
        const r=await fetch(`${BACKEND_SEARCH}?q=${encodeURIComponent(eQ)}`);
        if(!r.ok)return[];
        const data=await r.json();
        if(!data.results?.length)return[];
        return data.results.filter(r=>allowedDomains.some(d=>r.url.toLowerCase().includes(d)));
      }catch{return[]}
    }

    async function searchCarInfo(query){
      const low=query.toLowerCase();
      const wantsUsed=['usato','usata','usati','usate','seconda mano','km zero','centroauto','occasione'].some(k=>low.includes(k));
      const brand=detectBrand(query);
      const sections=[];

      // Se la marca non è tra le 4 vendute nuove da CentroAuto, o l'utente chiede esplicitamente dell'usato,
      // controlla anche la disponibilità nell'usato del dealer
      if(wantsUsed||(brand&&!NEW_BRAND_KEYS.includes(brand.key))){
        const usedResults=await runSearch(`${query} site:centroautovt.it/ricerca-auto/usate`,['centroautovt.it']);
        if(usedResults.length){
          sections.push(`━━━ DISPONIBILE USATO DA CENTROAUTO VT ━━━\n\n${usedResults.slice(0,5).map(r=>`🚗 ${r.title}\n${r.description}\n🔗 ${r.url}`).join("\n\n")}`);
        }
      }

      // Cerca SEMPRE le informazioni ufficiali e aggiornate direttamente sul sito della marca rilevata
      if(brand){
        const officialResults=await runSearch(`${query} scheda tecnica allestimenti versioni site:${brand.domain}`,[brand.domain]);
        if(officialResults.length){
          sections.push(`━━━ FONTE UFFICIALE: ${brand.name.toUpperCase()} (${brand.domain}) ━━━\n\n${officialResults.slice(0,3).map(r=>`${r.title}\n\n${r.description}\n\n🔗 ${r.url}`).join("\n\n")}`);
        }
      }else{
        // Nessuna marca riconosciuta nel testo: fallback sulle 4 marche nuove di CentroAuto
        const genericResults=await runSearch(`${query} allestimenti versioni site:fiat.it OR site:jeep-official.it OR site:alfaromeo.it OR site:lancia.it OR site:mazda.it OR site:aixam.it`,['fiat.it','jeep-official.it','alfaromeo.it','lancia.it','mazda.it','aixam.it']);
        if(genericResults.length){
          sections.push(genericResults.slice(0,3).map(r=>{const b=r.url.includes('fiat')?'Fiat':r.url.includes('jeep')?'Jeep':r.url.includes('alfa')?'Alfa Romeo':r.url.includes('lancia')?'Lancia':r.url.includes('mazda')?'Mazda':'Aixam';return`━━━ ${b.toUpperCase()} ━━━\n${r.title}\n\n${r.description}\n\n🔗 ${r.url}`}).join("\n\n"));
        }
      }

      return sections.length?sections.join("\n\n────────────────\n\n"):null;
    }
    const SYSTEM_PROMPT=`Sei un assistente esperto di auto NUOVE e USATE. AUTO NUOVE vendute da CentroAuto: Fiat, Jeep, Alfa Romeo, Lancia, Mazda, Aixam. AUTO USATE (tutte le marche): CentroAuto VT. Quando ricevi "DATI UFFICIALI" nel messaggio, trattali come fonte primaria aggiornata (anche per marche diverse da quelle vendute nuove, utile per confronti o per schede di auto usate). Risposte SCHEMATICHE e CONCISE (max 10 righe), usa elenchi puntati, solo dati concreti e verificabili. Se un modello recentissimo non compare nei dati ricevuti, dillo chiaramente invece di inventare specifiche.`;

    async function sendMessage(){
      const msg=chatInputField.value.trim();if(!msg)return;
      addMessage(msg,"user");chatInputField.value="";chatSendBtn.disabled=true;
      chatHistory.push({role:"user",content:msg});showTyping();
      try{
        const sr=needsSearch(msg)?await searchCarInfo(msg):null;
        const messages=[{role:"system",content:SYSTEM_PROMPT},...chatHistory];
        if(sr)messages.push({role:"system",content:`DATI UFFICIALI:\n\n${sr}\n\nRispondi usando SOLO questi dati in formato schematico. Se il modello richiesto non compare nei dati sopra, dillo esplicitamente invece di inventare.`});
        const r=await fetch(BACKEND_CHAT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
        if(!r.ok)throw new Error();
        const data=await r.json();hideTyping();
        let ai=data.choices?.[0]?.message?.content||"Scusa, non ho capito.";
        ai=ai.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
        addMessage(ai,"ai");chatHistory.push({role:"assistant",content:ai});
      }catch{hideTyping();addMessage("❌ Errore di connessione. Riprova tra poco.","ai")}
      finally{chatSendBtn.disabled=false;chatInputField.focus()}
    }

    function consegnaUid(){ return Math.random().toString(16).slice(2) + Date.now().toString(16) }

    function consegnaDateClass(dateStr){
      if(!dateStr) return "";

      if(dateStr < today) return "scaduta";
      if(dateStr === today) return "oggi";
      return "";
    }

    function consegnaFmtDate(dateStr){
      if(!dateStr) return "—";
      const [y,m,d] = dateStr.split("-");
      return `${d}/${m}/${y}`;

    function renderConsegne(){
      const box = $("consegnaList");
      if(!auth.currentUser){ box.innerHTML = '<div class="oggiEmpty" style="padding:10px 0">Login richiesto.</div>'; return; }
      const list = Object.values(consegneState.consegne || {})
        .sort((a,b) => (a.data||"").localeCompare(b.data||""));
      if(!list.length){ box.innerHTML = '<div class="oggiEmpty" style="padding:10px 0">Nessuna consegna programmata.</div>'; return; }

        const dcls = consegnaDateClass(con.data);

              ${checks.map((ch,i) => `
                <div class="consegnaCheckItem" onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:8px;">
                  <input type="checkbox" class="consegnaCheckBox" ${ch.done?"checked":""} onchange="event.stopPropagation();toggleConsegnaCheck('${con.id}',${i},this.checked)"/>
                  <span class="consegnaCheckLabel${ch.done?" done":""}" style="flex:1;">${escapeHtml(ch.text)}</span>
                  <button onclick="event.stopPropagation();toggleConsegnaCheck('${con.id}',${i},!${ch.done})" title="${ch.done?'Segna non fatto':'Segna fatto'}" style="width:22px;height:22px;border-radius:6px;border:1px solid ${ch.done?'rgba(34,197,94,.5)':'rgba(34,197,94,.25)'};background:${ch.done?'rgba(34,197,94,.18)':'rgba(34,197,94,.06)'};color:#6ee7b7;cursor:pointer;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;">✓</button>
                  <button onclick="event.stopPropagation();deleteConsegnaCheck('${con.id}',${i})" title="Rimuovi voce" style="width:22px;height:22px;border-radius:6px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.07);color:#fca5a5;cursor:pointer;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;">×</button>
                </div>`).join("")}
            </div>
            <div class="consegnaProgress" onclick="event.stopPropagation()">
              <div class="consegnaProgressBar"><div class="consegnaProgressFill" style="width:${pct}%"></div></div>

            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
              <button onclick="event.stopPropagation();consegnataPostVendita('${con.id}')"
                style="flex:1;padding:8px;border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.1);border-radius:9px;color:#6ee7b7;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;"
                onmouseover="this.style.background='rgba(34,197,94,.2)'" onmouseout="this.style.background='rgba(34,197,94,.1)'">
                ✅ Consegnata! → Sposta in Post-Vendita

                style="padding:8px 14px;border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.06);border-radius:9px;color:#fca5a5;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;"
                onmouseover="this.style.background='rgba(239,68,68,.14)'" onmouseout="this.style.background='rgba(239,68,68,.06)'">
                🗑 Elimina

      renderOggi();

    window.toggleConsegna = function(id, event){
      // Non chiudere se il click viene da checkbox, button o label interni
      if(event && event.target && (
        event.target.tagName === 'INPUT' ||
        event.target.tagName === 'BUTTON' ||
        event.target.closest('button') ||
        event.target.closest('.consegnaCheckItem')
      )) return;
      const body  = document.getElementById("cbody_"+id);
      const chev  = document.getElementById("chev_"+id);
      if(!body) return;
      const open = body.style.display !== "none";
      body.style.display = open ? "none" : "block";
      if(chev) chev.textContent = open ? "▼" : "▲";
    };

    window.toggleConsegnaCheck = function(id, idx, val){
      if(!consegneState.consegne[id]) return;
      const con = consegneState.consegne[id];
      if(!con.checks) con.checks = CHECKLIST_DEFAULT.map(t=>({text:t,done:false}));
      con.checks[idx].done = val;
      consegneWrite();
      renderConsegne();
    };
    window.deleteConsegnaCheck = function(id, idx){
      if(!consegneState.consegne[id]) return;
      const con = consegneState.consegne[id];
      if(!con.checks) con.checks = CHECKLIST_DEFAULT.map(t=>({text:t,done:false}));
      con.checks.splice(idx, 1);
      consegneWrite();
      renderConsegne();
    };
    window.deleteConsegna = function(id){
      delete consegneState.consegne[id];
      consegneWrite();
      renderConsegne();
      renderPostVendita();
    };

    // ══════════════════════════════════════════════════════════
    // FIX: consegnataPostVendita — _isConsegna: false + data reale
    // ══════════════════════════════════════════════════════════
    window.consegnataPostVendita = function(id){
      const con = consegneState.consegne[id];
      if(!con) return;

      const postId = "cons_" + id;

      // Crea l'entry in postState solo se non esiste già
      // (preserva eventuali stati intervista/recensione già salvati)
      if(!postState.followup[postId]) {
        postState.followup[postId] = {
          id: postId,
          cliente: con.cliente || con.modello || "Cliente",
          modello: con.modello || "",
          dataConsegna: con.data || dateKey(new Date()), // ← usa la data reale della consegna
          intervistaFatta: false,
          recensioneFatta: false,
          _isConsegna: false  // ← FIX: false → viene inclusa nel render del post-vendita
        };
      }

      // Rimuovi dal pre-consegna
      delete consegneState.consegne[id];
      consegneWrite();
      postWrite();
      renderConsegne();
      renderPostVendita();
      renderOggi();
    };

    async function consegneWrite(){
      if(!consegneDocRef) return;
      try{ await setDoc(consegneDocRef, consegneState, {merge:false}); }catch{}
    }

    $("consegnaAddBtn").addEventListener("click", () => {
      const cliente = $("consegnaCliente").value.trim();
      const modello = $("consegnaModello").value.trim();
      const data    = $("consegnaData").value;
      if(!cliente && !modello) return;
      const id = consegnaUid();
      consegneState.consegne[id] = {
        id, cliente, modello, data,
        checks: CHECKLIST_DEFAULT.map(t => ({text:t, done:false})),
        createdAt: Date.now()
      };
      $("consegnaCliente").value = "";
      $("consegnaModello").value = "";
      $("consegnaData").value    = "";
      consegneWrite();
      renderConsegne();
      renderPostVendita();
    });
    $("consegnaCliente").addEventListener("keypress", e=>{ if(e.key==="Enter") $("consegnaAddBtn").click(); });
    $("consegnaClearDoneBtn").addEventListener("click", () => {
      for(const [id,c] of Object.entries(consegneState.consegne)){
        const checks = c.checks || [];
        if(checks.length && checks.every(ch=>ch.done)) delete consegneState.consegne[id];
      }
      consegneWrite(); renderConsegne(); renderPostVendita();
    });

    function startConsegneSync(user){
      if(consegneUnsub){try{consegneUnsub()}catch{}}
      consegneDocRef = doc(db,"users",user.uid,"consegne","data");
      consegneUnsub = onSnapshot(consegneDocRef, snap => {
        consegneState = snap.exists() ? snap.data() : {consegne:{}};
        if(!consegneState.consegne) consegneState.consegne = {};
        renderConsegne(); renderPostVendita();
        if(!snap.exists()) setDoc(consegneDocRef, consegneState, {merge:false}).catch(()=>{});
      }, () => { renderConsegne(); renderPostVendita(); });
    }
    function stopConsegneSync(){
      if(consegneUnsub){try{consegneUnsub()}catch{}}
      consegneUnsub=null; consegneDocRef=null; consegneState={consegne:{}};
      renderConsegne(); renderPostVendita();
    }

    /* ══ POST VENDITA ══ */
    let postState = { followup: {} };
    let postDocRef = null, postUnsub = null;

    function postUid(){ return Math.random().toString(16).slice(2)+Date.now().toString(16) }
    function daysDiff(dateStr){
      if(!dateStr) return null;
      const now = new Date(); now.setHours(0,0,0,0);
      const d   = new Date(dateStr+"T00:00:00");
      return Math.round((now-d)/(1000*60*60*24));
    }

    function renderPostVendita(){
      const box = $("postList");
      if(!auth.currentUser){ box.innerHTML='<div class="oggiEmpty">Login richiesto.</div>'; return; }

      // Mostra SOLO i followup aggiunti manualmente col pulsante "✅ Consegnata!"
      // Filtra via eventuali entry create automaticamente da versioni precedenti (_isConsegna: true)
      const manual = Object.values(postState.followup || {}).filter(f => f._isConsegna !== true);

      if(!manual.length){
        box.innerHTML='<div class="oggiEmpty">Nessun follow-up. Usa "✅ Consegnata!" nella Pre-Consegna per aggiungere clienti qui.</div>';
        return;
      }

      // Ordina: prima urgenti (non completati), poi per data consegna più recente
      const sorted = manual.sort((a,b) => {
        const aUrgente = (!a.intervistaFatta || !a.recensioneFatta) ? 0 : 1;
        const bUrgente = (!b.intervistaFatta || !b.recensioneFatta) ? 0 : 1;
        return aUrgente - bUrgente || (b.dataConsegna||"").localeCompare(a.dataConsegna||"");

        const OB_TARGET_FIN_AUTO = Math.round(OB_TARGET_AUTO * OB_TARGET_FIN / 100); // = 8

/* ── carica PDF.js una sola volta ── */
let _pdfJsReady = false;
function loadPdfJs(){
  return new Promise(resolve=>{
    if(_pdfJsReady){resolve();return}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      _pdfJsReady=true;resolve();
    };
    document.head.appendChild(s);
  });
}

async function extractPdfText(base64){
  await loadPdfJs();
  const bin=atob(base64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:arr}).promise;
  let full='';
  for(let p=1;p<=Math.min(pdf.numPages,30);p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    full+=tc.items.map(i=>i.str).join(' ')+'\n\n';
  }
  return full.trim().slice(0,12000); // max ~12k chars per non sforare il context
}
